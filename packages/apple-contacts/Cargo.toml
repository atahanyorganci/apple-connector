[package]
name = "apple-contacts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Contacts framework wrapper for contact and group mutations on macOS"

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-contacts = "0.3"
objc2-foundation = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt"] }
