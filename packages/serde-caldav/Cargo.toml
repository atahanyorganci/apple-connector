[package]
name = "serde-caldav"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Serde Serializer and Deserializer for RFC 4791 CalDAV XML"

[lints]
workspace = true

[dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde-icalendar = { path = "../serde-icalendar" }

[dev-dependencies]
quick-xml = "0.37"
serde_json = "1"
