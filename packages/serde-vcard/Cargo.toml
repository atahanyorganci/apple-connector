[package]
name = "serde-vcard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Serde Serializer and Deserializer for RFC 6350 vCard text"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
