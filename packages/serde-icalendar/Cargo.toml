[package]
name = "serde-icalendar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Serde Serializer and Deserializer for RFC 5545 iCalendar text"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
icalendar = { version = "0.17", features = ["parser"] }
iso8601 = "0.6"
rrule = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
