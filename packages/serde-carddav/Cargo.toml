[package]
name = "serde-carddav"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Serde Serializer and Deserializer for RFC 6352 CardDAV XML"

[lints]
workspace = true

[dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde-vcard = { path = "../serde-vcard" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
