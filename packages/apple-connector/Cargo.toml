[package]
name = "apple-connector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

[dependencies]
apple-typedstream = { path = "../apple-typedstream" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
mime = "0.3"
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "derive",
  "macros",
  "runtime-tokio",
  "sqlite",
  "sqlite-unbundled",
] }
tempfile = "3"
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "macros"] }
utoipa-axum = "0.2"

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
