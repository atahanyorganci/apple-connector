[package]
name = "apple-connector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
apple-eventkit = { path = "../apple-eventkit" }
apple-notes-protobuf = { path = "../apple-notes-protobuf" }
apple-typedstream = { path = "../apple-typedstream" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
httpdate = "1"
mime = "0.3"
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde-caldav = { path = "../serde-caldav" }
serde-icalendar = { path = "../serde-icalendar" }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9.0", default-features = false, features = [
  "derive",
  "macros",
  "runtime-tokio",
  "sqlite",
  "sqlite-unbundled",
] }
tempfile = "3"
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "macros"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

[dev-dependencies]
axum = "0.8"
http = "1"
http-body-util = "0.1"
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "sqlite-unbundled",
] }
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
  "fs",
] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
