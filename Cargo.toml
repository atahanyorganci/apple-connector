[workspace]
members = [
  "packages/apple-connector",
  "packages/apple-contacts",
  "packages/apple-eventkit",
  "packages/apple-notes-protobuf",
  "packages/apple-typedstream",
  "packages/serde-carddav",
  "packages/serde-icalendar",
  "packages/serde-caldav",
  "packages/serde-vcard",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
unwrap_used = "deny"
expect_used = "deny"
